<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recipe Feed</title>
    <script>
        let loading = false;
        document.addEventListener('scroll', async () => {
            if (loading) return;
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
                loading = true;
                const items = document.querySelectorAll('.recipe');
                const last = items[items.length - 1];
                const before = last.getAttribute('data-created-at');
                const resp = await fetch(`/feed/more?before=${encodeURIComponent(before)}`);
                const more = await resp.json();
                const container = document.getElementById('feed');
                more.forEach(r => {
                    const div = document.createElement('div');
                    div.classList.add('recipe');
                    div.setAttribute('data-created-at', r.createdAt);
                    div.innerHTML = `
            <h3>${r.name}</h3>
            <p>${r.description}</p>
            <small>by ${r.authorName} at ${r.createdAt}</small>
          `;
                    container.appendChild(div);
                });
                loading = false;
            }
        });
    </script>
</head>
<body>
<div id="feed">
    <div th:each="r : ${recipes}"
         class="recipe"
         th:attr="data-created-at=${r.createdAt}">
        <h3 th:text="${r.name}">Recipe Name</h3>
        <p th:text="${r.description}">Desc…</p>
        <small th:text="'by ' + ${r.authorName} + ' at ' + ${#dates.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
    </div>
</div>
</body>
</html>
